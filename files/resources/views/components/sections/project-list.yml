fields:
    heading:
        type: text
        label: Heading
        default: Projects
    limit:
        type: number
        label: Projects to show
        min: 1
        max: 24
        step: 1
        default: "4"
    showLink:
        type: toggle
        label: Show the all-projects link
        default: "0"
    linkLabel:
        type: text
        label: Link label
        default: All projects
    linkUrl:
        type: url
        label: Link URL
        default: /projects
    showDescription:
        type: toggle
        label: Show one line of description under each project
        default: "0"
