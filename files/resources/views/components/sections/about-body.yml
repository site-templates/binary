fields:
    content:
        type: textarea
        rows: 14
        label: About text
        default: '<p>I have spent about ten years on interfaces, most of them somebody else&rsquo;s. The through line is the seam where design meets code: tokens, components, and the rules that decide what a thing looks like when nobody is looking at it directly.</p><p>I work best on products that already exist and have started to fray &mdash; the second design system, the rebuild that has to happen while the thing is still shipping. Greenfield work is more fun and teaches you less.</p><p>Before Amsterdam I was in Rotterdam, and before that I was going to be an architect. The drawings were bad and the buildings would have been worse, but the habit of drawing a thing at four scales before committing to it has been the single most useful thing I took from it.</p><p>I write here roughly monthly. If you want to talk about a project, or you disagree with something I wrote, email is the fastest way to reach me.</p>'
